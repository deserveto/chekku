# Infra base file: garage, searxng, reader, qdrant, and postgres definitions
# only — this file never publishes a host port. It is always merged with an
# environment overlay: scripts/dev.sh pairs it with compose.dev.yaml (loopback
# publishes for host-run processes) and scripts/prod.sh pairs it with
# compose.prod.yaml (application containers). Run the stack through those
# scripts; a bare `docker compose up` starts infra with no host listeners.
services:
  garage:
    image: dxflrs/garage:v2.3.0
    command: /garage server --single-node --default-bucket
    restart: unless-stopped
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY_ID:?Set GARAGE_ACCESS_KEY_ID}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_ACCESS_KEY:?Set GARAGE_SECRET_ACCESS_KEY}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_BUCKET:?Set GARAGE_BUCKET}
    volumes:
      - ./storage/.garage/garage.toml:/etc/garage.toml:ro
      - garage-metadata:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  searxng:
    image: docker.io/searxng/searxng:2026.7.18-277d8469c
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET}
    labels:
      chekku.searxng-config-hash: ${SEARXNG_CONFIG_HASH:?Set SEARXNG_CONFIG_HASH}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  reader:
    # Self-hosted Jina Reader OSS. Stateless by default — no cache, no auth,
    # no API key. The HTTP/1.1 port (8081 in the container) is what Chekku's
    # client talks to; the h2c port (8080) stays unpublished. The same image
    # powers the hosted r.jina.ai service, so the Markdown envelope contract
    # ({code, status, data: {title, url, content}}) is identical.
    # Pinned by digest (tag :oss floats; the digest is the multi-arch index,
    # so amd64 and arm64 hosts both resolve). To update, pull the new digest,
    # smoke-test read_web_page, and update here:
    #   docker manifest inspect ghcr.io/jina-ai/reader:oss | grep digest | head -1
    image: ghcr.io/jina-ai/reader:oss@sha256:8cc9a5cf6dc9c240235fccc0026661de74b6e13c21b36e6a86b3281b9ef10f28
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  qdrant:
    # Local vector index for the per-user Knowledge Base. The agent server is
    # the only Chekku process that talks to it; the browser never does. The
    # image ships no curl/wget, so the healthcheck probes the TCP port through
    # bash's /dev/tcp (the pattern recommended upstream for this image).
    image: docker.io/qdrant/qdrant:v1.15.1
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chekku
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: chekku_agent
    volumes:
      - ./scripts/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chekku -d chekku_agent"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

networks:
  # Named explicitly instead of taking the generated `chekku_default`, so hosts
  # running several stacks can identify this one. Every service resolves its
  # peers by Compose service name on it.
  default:
    name: chekku-network

volumes:
  garage-metadata:
  garage-data:
  searxng-cache:
  postgres-data:
  qdrant-data:
