# =============================================================================
# Chekku client nginx reverse proxy
# =============================================================================
#
# Sits between the public internet and the Next.js client container
# (127.0.0.1:3000, loopback-only by design). Terminates TLS, forwards to the
# client with the headers Better Auth and the in-process rate limiter need.
#
# INSTALL
#   1. Copy this file to /etc/nginx/sites-available/chekku.conf
#   2. Replace CHEKKU_HOSTNAME with your real hostname (e.g. studio.example.com)
#   3. ln -s /etc/nginx/sites-available/chekku.conf /etc/nginx/sites-enabled/
#   4. Get Let's Encrypt certs (fills in the paths below):
#        sudo certbot certonly --webroot -w /var/www/html -d CHEKKU_HOSTNAME
#   5. nginx -t && systemctl reload nginx
#   6. Set in client/.env.local:
#        BETTER_AUTH_URL=https://CHEKKU_HOSTNAME
#        RATE_LIMIT_TRUST_PROXY=true
#      ...and rebuild/restart the client so BETTER_AUTH_URL reaches the bundle.
#
# The client port defaults to 3000. If CHEKKU_CLIENT_HOST_PORT overrides it in
# client/.env.local, update `proxy_pass` below to match.

# ---------------------------------------------------------------------------
# HTTP: redirect everything to HTTPS except Let's Encrypt ACME challenges.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name CHEKKU_HOSTNAME;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS: terminate TLS, proxy to the Next.js client.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name CHEKKU_HOSTNAME;

    # Let's Encrypt paths (certbot default layout).
    ssl_certificate     /etc/letsencrypt/live/CHEKKU_HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CHEKKU_HOSTNAME/privkey.pem;

    # Modern cipher suite; nginx's default is already good, these just pin the
    # protocols. Drop TLSv1.2 if every client supports 1.3.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: enforce HTTPS for subdomain-aware clients. Once you are sure this
    # deployment is HTTPS-only and stable, raise max-age to 31536000 (1 year)
    # and consider adding `; includeSubDomains`.
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Body limits: Next.js server actions and chat input stay small; raise if
    # the studio uploads large attachments through the same origin.
    client_max_body_size 10m;

    # Proxy to the loopback-only client publish.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket / SSE: needed for Next.js dev hot reload and for any
        # streaming responses the client streams from the agent. Harmless when
        # unused; the upgrade header is set only when the client requests it.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forward identity to Better Auth and the in-process rate limiter.
        # RATE_LIMIT_TRUST_PROXY=true MUST be set in client/.env.local for the
        # limiter to read x-forwarded-for; otherwise this header is ignored.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bounded timeouts — a stuck agent stream should not hold a browser
        # connection forever. Raise `proxy_read_timeout` if you deliberately
        # stream long agent turns through the same connection.
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Next.js serves its own static assets out of /_next/. The defaults above
    # proxy them; enable the block below only if you want nginx to serve them
    # directly from the client container's build output (advanced; requires
    # mounting the build dir onto the host).
    # location /_next/static/ {
    #     alias /var/www/chekku/.next/static/;
    #     expires 365d;
    #     add_header Cache-Control "public, immutable";
    # }
}

# -----------------------------------------------------------------------------
# WebSocket upgrade map (referenced by $connection_upgrade above).
# Put this in /etc/nginx/conf.d/upgrade.conf OR the http {} block of nginx.conf.
# -----------------------------------------------------------------------------
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
