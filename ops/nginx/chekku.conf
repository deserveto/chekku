# =============================================================================
# Chekku client nginx reverse proxy
# =============================================================================
#
# Sits between the public internet and the Next.js client container
# (127.0.0.1:3000, loopback-only by design). Terminates TLS, forwards to the
# client with the headers Better Auth and the in-process rate limiter need.
#
# INSTALL (order matters on a fresh host)
#   1. Copy this file to /etc/nginx/sites-available/chekku.conf
#   2. Replace CHEKKU_HOSTNAME with your real hostname (e.g. studio.example.com)
#   3. Add the WebSocket upgrade map (see the bottom of this file) to
#      /etc/nginx/conf.d/upgrade.conf — nginx refuses to start without it
#      (`unknown "connection_upgrade" variable`).
#   4. Get certificates BEFORE enabling the site. On a fresh host nginx is not
#      yet able to serve the :443 block this config references, so bootstrap
#      with certbot's standalone server (nginx must be stopped):
#         sudo systemctl stop nginx
#         sudo certbot certonly --standalone -d CHEKKU_HOSTNAME
#         sudo systemctl start nginx
#      (Alternative: keep the packaged `default` site enabled and use
#       `certbot certonly --webroot -w /var/www/html -d CHEKKU_HOSTNAME`;
#       then remove the default site afterwards.)
#   5. ln -s /etc/nginx/sites-available/chekku.conf /etc/nginx/sites-enabled/
#   6. nginx -t && systemctl reload nginx
#   7. Persist the renewal reload hook (certbot.timer does NOT remember a
#      command-line --deploy-hook):
#         sudo tee /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh \
#           <<< 'systemctl reload nginx'
#         sudo chmod +x /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
#   8. Open the firewall if applicable: ufw allow 80,443/tcp
#   9. Set in client/.env.local and REBUILD the client image
#      (NEXT_PUBLIC_APP_URL is inlined by `next build`; BETTER_AUTH_URL is
#      server-runtime only and does not need the rebuild, but set both now):
#         BETTER_AUTH_URL=https://CHEKKU_HOSTNAME
#         NEXT_PUBLIC_APP_URL=https://CHEKKU_HOSTNAME
#         RATE_LIMIT_TRUST_PROXY=true
#
# The client port defaults to 3000. If CHEKKU_CLIENT_HOST_PORT overrides it in
# client/.env.local, update `proxy_pass` below to match.

# ---------------------------------------------------------------------------
# HTTP: redirect everything to HTTPS except Let's Encrypt ACME challenges.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name CHEKKU_HOSTNAME;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS: terminate TLS, proxy to the Next.js client.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name CHEKKU_HOSTNAME;

    # Let's Encrypt paths (certbot default layout).
    ssl_certificate     /etc/letsencrypt/live/CHEKKU_HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CHEKKU_HOSTNAME/privkey.pem;

    # Protocols only; the cipher list deliberately stays nginx's compiled
    # default (modern and maintained upstream) rather than pinning a list
    # that will age inside this template.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: enforce HTTPS. Once you are sure this deployment is HTTPS-only
    # and stable, consider adding `; includeSubDomains` (and `preload` only
    # after submitting to the HSTS preload list).
    add_header Strict-Transport-Security "max-age=63072000" always;
    # Edge security headers. The app owns CSP; these are proxy-level
    # hardening that does not depend on app code.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Body limits: chat file uploads send base64-inflated multimodal messages
    # (client cap: 8 MiB base64 + wrapped text attachments + prompt, worst
    # case ~10.5 MiB; agent server bodySizeLimit stays 12 MiB). The largest
    # legitimate body is now a Knowledge PDF upload: raw 16 MiB + multipart
    # overhead → 17m. Raise this together with any upstream cap.
    client_max_body_size 17m;

    # Proxy to the loopback-only client publish.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket / SSE: needed for Next.js dev hot reload and for streamed
        # agent responses. Harmless when unused; the upgrade header is set
        # only when the client requests it.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Identity headers. X-Forwarded-For MUST be $remote_addr (overwrite,
        # not append): the app's clientIp() reads the LEFTMOST XFF entry, so
        # $proxy_add_x_forwarded_for would let a client spoof that entry and
        # defeat the auth rate limiter when RATE_LIMIT_TRUST_PROXY=true.
        # Behind a CDN (e.g. Cloudflare) that appends to XFF, the CDN's
        # leftmost entry is then attacker-supplied — terminate the CDN's XFF
        # handling here the same way or do not set RATE_LIMIT_TRUST_PROXY.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming: the client streams agent responses (text/event-stream),
        # so buffering must be off or tokens arrive quantized. gzip is off
        # for the same location — gzip on streamed responses also buffers,
        # and text/event-stream should not be transformed in transit.
        proxy_buffering off;
        gzip off;

        # Bounded timeouts. proxy_read_timeout is the max GAP between bytes,
        # not total duration; a silent stretch mid-agent-turn longer than
        # this drops the stream (504). 600s covers slow tool calls and long
        # reasoning turns; tune down if you prefer faster failure.
        proxy_connect_timeout 5s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # Next.js serves its own static assets out of /_next/. The defaults above
    # proxy them; enable the block below only if you want nginx to serve them
    # directly from the client container's build output (advanced; requires
    # mounting the build dir onto the host). WARNING: any add_header here
    # suppresses the inherited HSTS/security headers for this location —
    # re-declare them if you enable it.
    # location /_next/static/ {
    #     alias /var/www/chekku/.next/static/;
    #     expires 365d;
    #     add_header Cache-Control "public, immutable";
    # }
}

# -----------------------------------------------------------------------------
# WebSocket upgrade map (referenced by $connection_upgrade above).
# Put this in /etc/nginx/conf.d/upgrade.conf OR the http {} block of nginx.conf.
# `'' -> ""` (not `close`) preserves nginx->client keepalive on non-WS requests.
# -----------------------------------------------------------------------------
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      "";
# }
